[SC002]
brief = "type contains itself by value"
group = "layout"

    [SC002.E]
    explain = """
    # recursive type layout

    a type's definition requires its own size. the by-value edges of a type - value fields, base
    classes, fixed-array elements, tuple elements, and generic arguments that land by value - form a
    cycle, so no layout assignment exists. only these edges are considered: a pointer, a nullable, a
    vector, a map or a set is satisfied by a forward declaration and never closes a cycle.

    ```kairo
    class Node {
        var next: Node;    // Node's size includes Node's size
    }
    ```

    ## how to fix

    break the cycle with an indirection: hold the recursive member behind a pointer (`*Node`), a
    nullable (`Node?`), or a vector (`[Node]`). one indirection anywhere on the cycle is enough.
    """

    [SC002.N]
    explain = """
    # note: a step on the layout cycle

    attached to a recursive-layout error. each note names one by-value edge on the cycle, in the
    order the layout walk took them, so the whole path from the reported type back to itself is
    visible.
    """

[SC003]
brief = "primitive type is not available on the target"
group = "portability"

    [SC003.E]
    explain = """
    # non-portable primitive for this target

    a primitive type was spelled whose representation exists only on some architectures, and the
    target being compiled for is not one of them. the effective target triple - `--target` if given,
    otherwise the host triple, after `-m32`/`-m64` - is named in the message.

    today `f80` is the only such type. it is the x87 80-bit extended format: 1 sign bit, 15 exponent
    bits and a 64-bit significand with an EXPLICIT integer bit, which no IEEE interchange format has.
    it is a property of the x87 register stack, so it exists on x86 and x86_64 and nowhere else. on
    AArch64, RISC-V, PowerPC, WebAssembly and everything else there is no such register, no such
    instruction, and C's `long double` is simply `double`.

    ```kairo
    // building with --target=aarch64-unknown-linux-gnu
    var x: f80 = 1.0;   // error: no x87 on aarch64
    ```

    the compiler will not pick a replacement for you. widening to `f128` changes the arithmetic
    (f128 is IEEE binary128, a different format, and every operation on it is a compiler-rt libcall),
    and narrowing to `f64` silently drops 11 bits of significand. either one turns a build error into
    a numerical difference that shows up much later and much further away, so neither happens.

    ## how to fix

    use `f64` if double precision is enough, or `f128` if you need the range and can pay for the
    libcalls - but write the choice down, so the code says which one it meant. if the type is only
    there to match a C `long double` across FFI, note that `long double` is already `double` on these
    targets, so `f64` is the correct mapping. if the code is genuinely x86-only, guard it and build it
    for an x86 target.
    """
