[P002]
brief = "module filenames differ only by case"
group = "modules"

    [P002.E]
    explain = """
    # module filenames differ only by case

    two module files in one directory have names that differ only in case (`Foo.k` and `foo.k`).
    these are two distinct files on a case-sensitive filesystem (typically Linux) and ONE file on a
    case-insensitive one (the default on macOS and Windows), so the source tree does not mean the
    same thing on every platform - and a module identity, which is what determines the emitted C++
    namespace path, would differ between builds of the same code.

    ## how to fix

    rename one of the files so the two names differ by more than case.
    """

[P003]
brief = "primitive type is not available on the target"
group = "portability"

    [P003.E]
    explain = """
    # non-portable primitive for this target

    a primitive type was spelled whose representation exists only on some architectures, and the
    target being compiled for is not one of them. the effective target triple - `--target` if given,
    otherwise the host triple, after `-m32`/`-m64` - is named in the diagnostic.

    today `f80` is the only such type. it is the x87 80-bit extended format: 1 sign bit, 15 exponent
    bits and a 64-bit significand with an EXPLICIT integer bit, which no IEEE interchange format has.
    it is a property of the x87 register stack, so it exists on x86 and x86_64 and nowhere else. on
    AArch64, RISC-V, PowerPC, WebAssembly and everything else there is no such register, no such
    instruction, and C's `long double` is simply `double`.

```kairo
    // building with --target=aarch64-unknown-linux-gnu
    var x: f80 = 1.0;   // error: no x87 on aarch64
```

    Kairo does not substitute a nearby float type. `f128` is IEEE binary128, a different format with
    a compiler-rt libcall per operation; `f64` drops 11 bits of significand. either substitution
    would turn a build error into a numerical difference discovered much later and much further
    away. the choice is yours to write down.

    ## how to fix

    **matching a C `long double` across FFI?** use `f64`. on every target that rejects `f80`,
    C's `long double` is already `double` - so `f64` is not a compromise, it is the correct mapping.

    otherwise, pick by what the code needs: `f64` if double precision is enough, `f128` if you need
    the range and can pay for the libcalls. write the choice down, so the code says which one it
    meant.

    if the code is genuinely x86-only, guard it and build it for an x86 target.
    """